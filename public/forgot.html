<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aria - Forgot Password</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">🌙</button>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">✨</div>
      <h1>Reset password</h1>
      <p>Enter your email and we’ll send a reset link.</p>
    </div>

    <div class="auth-form active" id="forgotForm">
      <div class="error-msg" id="forgotError"></div>
      <div class="success-msg" id="forgotSuccess" style="display:none;"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="forgotEmail" placeholder="Enter your email" />
      </div>
      <button class="btn-primary" type="button" onclick="handleForgotPassword()">Send reset link</button>
      <button class="btn-secondary" type="button" style="margin-top:12px;" onclick="window.location.href='login.html'">Back to login</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const savedTheme = localStorage.getItem('aria_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('aria_theme', next);
      document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
    }
    function showError(message) {
      const el = document.getElementById('forgotError');
      el.textContent = message;
      el.style.display = 'block';
      document.getElementById('forgotSuccess').style.display = 'none';
      setTimeout(() => el.style.display = 'none', 4000);
    }
    function showSuccess(message) {
      const el = document.getElementById('forgotSuccess');
      el.textContent = message;
      el.style.display = 'block';
      document.getElementById('forgotError').style.display = 'none';
    }
    async function handleForgotPassword() {
      const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
      if (!email) return showError('Please enter your email');
      try {
        const res = await fetch(API_BASE + '/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data && data.success) {
          showSuccess('If that email is registered, a reset link is on its way.');
        } else {
          showError('Something went wrong. Please try again.');
        }
      } catch (err) {
        showError('Could not connect to server');
      }
    }
  </script>
</body>
</html>
